<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sfumatura verde smeraldo elegante -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" /> <!-- Verde brillante in alto a sx -->
      <stop offset="100%" stop-color="#059669" /> <!-- Smeraldo intenso in basso a dx -->
    </linearGradient>
    
    <!-- Ombra delicata per la mela -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Sfondo arrotondato (Stile iOS App) -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  
  <!-- Icona Mela di Lucide, ingrandita e centrata -->
  <g transform="translate(136, 136) scale(10)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>
    <path d="M10 2c1 .5 2 2 2 5"/>
  </g>
</svg>
